<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meerya Speakerphone Test</title>
  <style>
    body { background:#f7f8fa; color:#17212b; font:16px/1.5 system-ui,sans-serif; margin:0; padding:40px; }
    main { max-width:720px; margin:auto; }
    .error { color:#9b1c1c; white-space:pre-wrap; }
  </style>
</head>
<body>
  <main id="loader">Loading the Meerya speakerphone test…</main>
  <script>
    (async () => {
      try {
        const response = await fetch("../index.html", { cache: "no-store" });
        if (!response.ok) throw new Error(`Could not load the test application: HTTP ${response.status}`);
        let html = await response.text();
        html = html.replace('<html lang="en">', '<html lang="en" data-mode="test">');
        html = html.replace("<head>", '<head><base href="../">');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const loader = document.getElementById("loader");
        loader.className = "error";
        loader.textContent = `Meerya test could not load.\n${error.message}`;
      }
    })();
  </script>
</body>
</html>
